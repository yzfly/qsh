[workspace]
# MSRV-aware: picks dependency versions that build with rust-version
resolver = "3"
members = ["crates/qsh-core", "crates/qsh-cli", "xtask"]
# What `cargo build` builds by default: the programs, not the development tasks
default-members = ["crates/qsh-core", "crates/qsh-cli"]
# cargo-fuzz targets build with nightly and their own lock file
exclude = ["fuzz"]

[workspace.package]
version = "0.5.0"
edition = "2021"
# quinn 0.11.11 needs 1.85; that is also the rustc of Debian 13 (trixie)
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yzfly/qsh"
homepage = "https://github.com/yzfly/qsh"
authors = ["yzfly <zphyix@gmail.com>"]

[workspace.dependencies]
qsh-core = { path = "crates/qsh-core", version = "0.5.0", default-features = false }
tokio = { version = "1.40", default-features = false }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.20", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
ring = "0.17.8"
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.120"
libc = "0.2.150"
# Wipes session keys from memory when they are dropped. Tiny, no dependencies, packaged by
# Debian and Fedora, and already in the build through rustls.
zeroize = { version = "1.7", default-features = false, features = ["alloc"] }
# qsh_config(5) is TOML. Only the parser: its spanned document tree (toml::de::DeTable) gives
# the line of every key for warnings, without serde. rust-toml in Debian and Fedora.
toml = { version = "1", default-features = false, features = ["std", "parse"] }
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
# The daemon's screen model for smart catch-up (m2.md 6.2): a terminal emulator state, MIT,
# with vte (the alacritty parser) and unicode-width; rust-vt100 in Debian and Fedora. 0.16:
# 0.15 has neither the faint attribute nor Screen::set_size.
vt100 = "0.16"
# zstd for OUTPUT_ZSTD (m2.md 7.3): pure Rust, encoder and decoder, MIT; rust-ruzstd in Debian
# and Fedora. 0.8 is the first with an encoder. The lock file keeps 0.8.1, the newest that
# builds with Rust 1.85 (0.8.2 uses u32::is_multiple_of, 0.8.3 declares 1.87).
# Only its encoder is used: its decoder does not bound what one block produces (a few bytes
# can expand to gigabytes), so qsh decodes with its own bounded decoder (codec.rs).
ruzstd = { version = "0.8.1", default-features = false, features = ["std"] }
# XXH64, for the optional content checksum of received zstd frames; in the tree with ruzstd and
# quinn's dependencies before, rust-twox-hash in Debian and Fedora.
twox-hash = { version = "2", default-features = false, features = ["xxhash64"] }

[workspace.lints.rust]
# deny, not forbid: qsh-core allows it in sys.rs alone; qsh-cli forbids it in its sources
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwind, not abort (the default; said here because it matters): the daemon contains a panic of
# the screen model or the codec with catch_unwind and loses one feature of one session instead
# of every session of the user (protocol.md 7.8.7, qsh_core::fault); the upgrade fallback and
# the client's terminal restore run from panic hooks, which work the same either way. The cost
# is the unwind tables and landing pads: qsh-server 4.19 MB -> 4.81 MB (+0.6 MB, +15 %, x86_64,
# measured 2026-10-06), worth one session's fault never ending them all. Distribution builds use
# their own flags but keep the profile's panic strategy. The fuzz targets are built by
# cargo-fuzz in their own workspace; libfuzzer-sys's panic hook aborts before any unwinding,
# so a contained panic is still a crash there.
panic = "unwind"
strip = true
