[package]
name = "qsh-core"
description = "qsh: a remote shell over QUIC whose sessions survive network changes (library)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["ssh", "quic", "shell", "terminal", "mosh"]
categories = ["network-programming", "command-line-utilities"]

[features]
default = ["hub", "zstd"]
# The resident client that keeps one connection per server for many terminals (embedders)
hub = []
# Compression (the `zstd` capability, OUTPUT_ZSTD, protocol.md 7.12) with the pure Rust ruzstd;
# without it the capability is never offered
zstd = ["dep:ruzstd", "dep:twox-hash"]
# Unstable environment hooks for the upgrade and chaos tests (QSH_TEST_VERSION,
# QSH_TEST_HANDOFF_FAULT): never in release or distribution builds
test-hooks = []

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "signal", "process", "fs"] }
quinn.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
zeroize.workspace = true
toml.workspace = true
vt100.workspace = true
ruzstd = { workspace = true, optional = true }
twox-hash = { workspace = true, optional = true }

[dev-dependencies]
# Paused time for the network watcher's debounce tests
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

# The catch-up and compression tests throttle the daemon's output (QSH_TEST_THROTTLE)
[[test]]
name = "catchup"
required-features = ["test-hooks"]

# Faults stay local: injected panics of the screen model and the codec, a refused snapshot
[[test]]
name = "faults"
required-features = ["test-hooks", "zstd"]
