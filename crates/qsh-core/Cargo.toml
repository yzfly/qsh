[package]
name = "qsh-core"
description = "qsh: a remote shell over QUIC whose sessions survive network changes (library)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["ssh", "quic", "shell", "terminal", "mosh"]
categories = ["network-programming", "command-line-utilities"]

[features]
default = ["hub"]
# The resident client that keeps one connection per server for many terminals (embedders)
hub = []

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "signal", "process", "fs"] }
quinn.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
zeroize.workspace = true
toml.workspace = true

[dev-dependencies]
# Paused time for the network watcher's debounce tests
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
